[project]
name = "devin-vlsi-worker"
version = "0.1.0"
description = "Isolated EDA worker for Auto-VLSI: runs allowlisted tool adapters and returns machine-readable evidence."
requires-python = ">=3.11"
dependencies = [
  "cocotb==2.1.0",
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
devin-vlsi-worker = "devin_vlsi_worker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["devin_vlsi_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["eda: needs the real EDA toolchain (verilator, iverilog, yosys, sby, z3)"]
